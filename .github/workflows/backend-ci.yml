# CI/CD pipeline for the GMC Lanka backend (SENG 34213 guideline, section 7.2)
#
#   Stage                 Runs on
#   Lint & Format         every push, every PR          Checkstyle + Spotless (Palantir Java Format)
#   Build                 every push, every PR          mvn package (jar uploaded)
#   Unit Tests            every push, every PR          JUnit + JaCoCo unit coverage report
#   Integration Tests     push to develop, PR to develop   *IT.java against MySQL 8, merged
#                                                       unit + integration coverage gate (80% lines)
#   Security Scan         push to develop / main, PRs   Trivy dependency scan, fails on HIGH/CRITICAL
#   Deploy - Staging      merge to develop, after all stages pass
#   Deploy - Production   merge to main, after all stages pass + manual approval
#
# Reusable workflow: test-gmc-lanka/backend calls it from its own .github/workflows/ci.yml, which
# owns the triggers, concurrency and permissions. Here `github.*`, `vars.*` and secrets all refer to
# the calling repository. The *IT.java suites come from the tests repository (checked out into .tests
# and added as a test source root by pom.xml); the Dockerfile, Trivy exceptions and coverage script
# come from this repository (checked out into .infra).
name: Backend CI/CD

on:
  workflow_call:
    inputs:
      infra-ref:
        description: Branch or tag of test-gmc-lanka/infra to take the Dockerfile and CI scripts from
        type: string
        default: main

permissions:
  contents: read

env:
  # integration-tests.dir: where pom.xml picks up the *IT.java sources from the tests repository
  MAVEN_ARGS: -B --no-transfer-progress -Dintegration-tests.dir=${{ github.workspace }}/.tests/backend/src/test/java
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Checkstyle (fails on violations)
        run: ./mvnw checkstyle:check
      - name: Formatting check (fix locally with ./mvnw spotless:apply)
        run: ./mvnw spotless:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: test-gmc-lanka/infra/.github/actions/checkout-sibling@main
        with:
          repository: tests
          path: .tests
      - name: Compile and package
        run: ./mvnw package -DskipTests -Dcheckstyle.skip
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: target/*.jar
          retention-days: 7

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: test-gmc-lanka/infra/.github/actions/checkout-sibling@main
        with:
          repository: tests
          path: .tests
      - uses: actions/checkout@v7
        with:
          repository: test-gmc-lanka/infra
          ref: ${{ inputs.infra-ref }}
          path: .infra
      - name: Run unit tests (H2 in-memory database)
        run: ./mvnw test -Dcheckstyle.skip
      - name: Unit coverage summary
        if: always()
        run: bash .infra/scripts/coverage-summary.sh target/site/jacoco/jacoco.csv "Unit test coverage" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unit coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage-report
          path: target/site/jacoco/
          retention-days: 14
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: target/surefire-reports/

  integration-tests:
    name: Integration Tests & Coverage Gate
    runs-on: ubuntu-latest
    needs: lint
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' && github.base_ref == 'develop')
    services:
      mysql:
        image: mysql:8.0
        env:
          # Throwaway database that only exists for this job
          MYSQL_DATABASE: gmc_test_db
          MYSQL_ROOT_PASSWORD: testroot
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: test-gmc-lanka/infra/.github/actions/checkout-sibling@main
        with:
          repository: tests
          path: .tests
      - uses: actions/checkout@v7
        with:
          repository: test-gmc-lanka/infra
          ref: ${{ inputs.infra-ref }}
          path: .infra
      # Runs unit tests and *IT.java, merges both coverage files and enforces the 80% gate
      - name: Run unit + integration tests against MySQL
        run: ./mvnw verify -Dcheckstyle.skip
        env:
          DB_URL: jdbc:mysql://localhost:3306/gmc_test_db
          DB_USERNAME: root
          DB_PASSWORD: testroot
      - name: Merged coverage summary
        if: always()
        run: bash .infra/scripts/coverage-summary.sh target/site/jacoco-merged/jacoco.csv "Unit + integration coverage" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/site/jacoco-merged/
          retention-days: 14
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: |
            target/surefire-reports/
            target/failsafe-reports/
      - name: Upload coverage to Codecov (for the README badge)
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: codecov/codecov-action@v5
        with:
          files: target/site/jacoco-merged/jacoco.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: actions/checkout@v7
        with:
          repository: test-gmc-lanka/infra
          ref: ${{ inputs.infra-ref }}
          path: .infra
      # Trivy reads the resolved dependencies from ~/.m2 instead of hammering Maven Central
      - name: Resolve dependencies
        run: ./mvnw dependency:resolve
      - name: Dependency vulnerability scan (fails on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_OFFLINE_SCAN: true
        with:
          scan-type: fs
          scan-ref: pom.xml
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: .infra/security/backend.trivyignore.yaml
          exit-code: '1'
          format: table

  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: [build, unit-tests, integration-tests, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v7
        with:
          repository: test-gmc-lanka/infra
          ref: ${{ inputs.infra-ref }}
          path: .infra
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .infra/docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:staging
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger staging deploy
        env:
          DEPLOY_HOOK: ${{ secrets.STAGING_DEPLOY_HOOK }}
          IMAGE: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::STAGING_DEPLOY_HOOK secret is not set; image pushed but not deployed."
            exit 0
          fi
          curl -fsS -X POST --get "$DEPLOY_HOOK" --data-urlencode "imgURL=$IMAGE" > /dev/null
          echo "Deploy triggered for $IMAGE"
      - name: Smoke test
        if: ${{ vars.STAGING_URL != '' }}
        env:
          URL: ${{ vars.STAGING_URL }}
        run: |
          # The public product list needs the app and its database to be up
          for i in $(seq 1 40); do
            if curl -fsS "$URL/api/products" > /dev/null; then echo "Staging is up"; exit 0; fi
            echo "Waiting for $URL ($i/40)..."; sleep 15
          done
          echo "::error::Staging did not become healthy"; exit 1

  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: [build, unit-tests, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Manual approval: add required reviewers to the "production" environment in repo settings
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    permissions:
      contents: write # create the release tag
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Read version from pom.xml
        id: version
        run: |
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "tag=v${VERSION%-SNAPSHOT}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: test-gmc-lanka/infra
          ref: ${{ inputs.infra-ref }}
          path: .infra
      - name: Stop if this version was already released
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG already exists. Bump <version> in pom.xml on the release branch."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .infra/docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger production deploy
        env:
          DEPLOY_HOOK: ${{ secrets.PRODUCTION_DEPLOY_HOOK }}
          IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::PRODUCTION_DEPLOY_HOOK secret is not set; image pushed but not deployed."
            exit 0
          fi
          curl -fsS -X POST --get "$DEPLOY_HOOK" --data-urlencode "imgURL=$IMAGE" > /dev/null
      - name: Tag the release (SemVer)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
