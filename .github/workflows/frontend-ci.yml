# CI/CD pipeline for the GMC Lanka frontend (SENG 34213 guideline, section 7.2)
#
#   Stage                 Runs on
#   Lint & Format         every push, every PR
#   Build                 every push, every PR
#   Unit Tests            every push, every PR (coverage report uploaded)
#   Integration Tests     push to develop, PR to develop
#   Security Scan         push to develop / main, PR to develop / main
#   Deploy - Staging      push (merge) to develop, after all stages pass
#   Deploy - Production   push (merge) to main, after all stages pass + manual approval
#
# Reusable workflow: test-gmc-lanka/frontend calls it from its own .github/workflows/ci.yml, which
# owns the triggers, concurrency and permissions. Here `github.*`, `vars.*` and secrets all refer to
# the calling repository. Integration tests come from the tests repository (checked out into .tests)
# and the Dockerfile and nginx config from this repository (checked out into .infra).
name: Frontend CI/CD

on:
  workflow_call:
    inputs:
      infra-ref:
        description: Branch or tag of test-gmc-lanka/infra to take the Dockerfile and nginx config from
        type: string
        default: main

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  # Read by vite.config.js to find the integration tests from the tests repository
  INTEGRATION_TESTS_DIR: ${{ github.workspace }}/.tests/frontend

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: ESLint (fails on errors)
        run: npm run lint
      - name: Prettier check (fails if unformatted)
        run: npm run format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: test-gmc-lanka/infra/.github/actions/checkout-sibling@main
        with:
          repository: tests
          path: .tests
      - run: npm ci
      # Runs the whole suite so the coverage report and per-file thresholds include every test
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log(["### Test coverage", "| Metric | % | Covered |", "|---|---|---|",
                ...["lines", "statements", "branches", "functions"].map(row)].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
      - name: Upload coverage to Codecov (for the README badge)
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' && github.base_ref == 'develop')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: test-gmc-lanka/infra/.github/actions/checkout-sibling@main
        with:
          repository: tests
          path: .tests
      - run: npm ci
      - run: npm run test:integration

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Dependency vulnerability scan (fails on high/critical)
        run: npm audit --audit-level=high
      - name: Verify package signatures and provenance (OWASP A08)
        run: npm audit signatures

  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: [build, unit-tests, integration-tests, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: test-gmc-lanka/infra
          ref: ${{ inputs.infra-ref }}
          path: .infra
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .infra/docker/frontend/Dockerfile
          build-contexts: nginx=.infra/docker/frontend/nginx
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:staging
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger staging deploy
        env:
          DEPLOY_HOOK: ${{ secrets.STAGING_DEPLOY_HOOK }}
          IMAGE: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::STAGING_DEPLOY_HOOK secret is not set; image pushed but not deployed."
            exit 0
          fi
          curl -fsS -X POST --get "$DEPLOY_HOOK" --data-urlencode "imgURL=$IMAGE" > /dev/null
          echo "Deploy triggered for $IMAGE"
      - name: Smoke test
        if: ${{ vars.STAGING_URL != '' }}
        env:
          URL: ${{ vars.STAGING_URL }}
          SHA: ${{ github.sha }}
        run: |
          # Wait for the new release to come up, then check the health endpoint and the SPA shell
          for i in $(seq 1 30); do
            if curl -fsS "$URL/healthz" > /dev/null; then break; fi
            echo "Waiting for $URL ($i/30)..."; sleep 10
          done
          curl -fsS "$URL/healthz"
          curl -fsS "$URL/" | grep -q '<div id="root">'
          echo "Staging is up for $SHA"

  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: [build, unit-tests, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Manual approval: add required reviewers to the "production" environment in repo settings
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    permissions:
      contents: write # create the release tag
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: test-gmc-lanka/infra
          ref: ${{ inputs.infra-ref }}
          path: .infra
      - name: Read version from package.json
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Stop if this version was already released
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG already exists. Bump the version in package.json on the release branch."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .infra/docker/frontend/Dockerfile
          build-contexts: nginx=.infra/docker/frontend/nginx
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger production deploy
        env:
          DEPLOY_HOOK: ${{ secrets.PRODUCTION_DEPLOY_HOOK }}
          IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::PRODUCTION_DEPLOY_HOOK secret is not set; image pushed but not deployed."
            exit 0
          fi
          curl -fsS -X POST --get "$DEPLOY_HOOK" --data-urlencode "imgURL=$IMAGE" > /dev/null
      - name: Tag the release (SemVer)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
