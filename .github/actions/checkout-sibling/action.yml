# Checks out another test-gmc-lanka repository next to the one being built.
# Uses the branch with the same name as the current one when it exists (so a feature branch in
# backend picks up the matching feature branch in tests), otherwise develop, otherwise main.
name: Checkout sibling repository
description: Check out a test-gmc-lanka repository on the matching branch

inputs:
  repository:
    description: Repository name inside the test-gmc-lanka organisation, e.g. tests
    required: true
  path:
    description: Directory (relative to the workspace) to check it out into
    required: true

outputs:
  ref:
    description: The branch that was checked out
    value: ${{ steps.ref.outputs.ref }}

runs:
  using: composite
  steps:
    - name: Pick branch of ${{ inputs.repository }}
      id: ref
      shell: bash
      env:
        URL: https://github.com/test-gmc-lanka/${{ inputs.repository }}.git
        BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        for ref in "$BRANCH" develop main; do
          if git ls-remote --exit-code --heads "$URL" "$ref" > /dev/null 2>&1; then
            echo "Using ${{ inputs.repository }}@$ref"
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done
        echo "::error::No usable branch found in $URL"
        exit 1
    - uses: actions/checkout@v7
      with:
        repository: test-gmc-lanka/${{ inputs.repository }}
        ref: ${{ steps.ref.outputs.ref }}
        path: ${{ inputs.path }}
